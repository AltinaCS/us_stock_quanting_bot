[package]
name = "quant_bot"
version = "0.1.0"
edition = "2024"
license = "MIT"
[dependencies]
dotenvy = "0.15"
# 非同步運行時，主導整個程式的 I/O 與排程
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
# 處理精準的財金數字（絕對不能用 float，會有精準度誤差，要用 Decimal）
chrono = { version = "0.4", features = ["serde"] }

# 序列化/反序列化，用來處理 API 回傳的 JSON 資料
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
#Decimal模組
rust_decimal = "1.34" # 或最新版本
rust_decimal_macros = "1.34"

